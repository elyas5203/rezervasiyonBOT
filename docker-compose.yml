version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rezervasiyon-app-local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - ADMIN_PORT=${ADMIN_PORT:-3001}
      - ADMIN_WEBVIEW_SECRET=${ADMIN_WEBVIEW_SECRET:-change_this_secret_in_env}
      - ADMIN_WEBVIEW_BASE_URL=${ADMIN_WEBVIEW_BASE_URL:-http://localhost:3000/admin}
      - STORAGE_PATH=/app/data
      - DB_PATH=/app/data/rezervasiyon.db
    volumes:
      - rezervasiyon_data:/app/data
    networks:
      - rezervasiyon_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3000}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  rezervasiyon_data:
    name: rezervasiyon_local_data

networks:
  rezervasiyon_network:
    name: rezervasiyon_isolated_net
    driver: bridge
